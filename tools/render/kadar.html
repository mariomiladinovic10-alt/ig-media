.mono { font-family: var(--f-mono); }

.tnum { font-variant-numeric: tabular-nums; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--raise); color: var(--fg); font-weight: 500; font-size: 13px; transition: background .15s, border-color .15s, opacity .15s; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: #4a4640; background: #2a2723; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

.btn-ghost { background: transparent; border-color: transparent; color: var(--mute); }

.chip:hover { color: var(--fg); border-color: #4a4640; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.field { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; color: var(--fg); padding: 9px 11px; font-size: 13.5px; line-height: 1.5; }
.field:focus { outline: none; border-color: var(--accent); }
select.field { height: 38px; padding-top: 0; padding-bottom: 0; }
label.lbl { display: block; font-size: 12px; color: var(--mute); margin-bottom: 6px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.badge { font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--mute); background: rgba(0,0,0,.55); }
.badge-ai { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.badge-pub { color: var(--ok); border-color: #3e5546; }
.badge-sch { color: var(--warn); border-color: #5a4630; }
.proof { border-radius: 10px; box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 18px 50px rgba(0,0,0,.45); background: #000; display: block; width: 100%; height: auto; }
.navbtn { display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; padding: 0 12px; border-radius: 8px; color: var(--mute); font-size: 13.5px; transition: all .15s; white-space: nowrap; }
.navbtn:hover { color: var(--fg); background: var(--raise); }
.navbtn[aria-current="page"] { color: var(--fg); background: var(--raise); box-shadow: inset 0 0 0 1px var(--line); }
.navbtn .num { font-family: var(--f-mono); font-size: 10px; color: #5f5a52; width: 18px; }
.navbtn[aria-current="page"] .num { color: var(--accent); }
.scroll-x { overflow-x: auto; scrollbar-width: none; }
.scroll-x::-webkit-scrollbar { display: none; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: min(420px, calc(100vw - 32px)); }
.bar { height: 6px; border-radius: 3px; background: var(--raise); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .2s; }
.fade-in { animation: fi .25s ease-out; }
@keyframes fi { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } * { transition: none !important; } }
.min0 { min-width: 0; }
textarea.field { resize: vertical; }
.swatch { aspect-ratio: 9/16; border-radius: 6px; border: 2px solid transparent; overflow: hidden; cursor: pointer; background: #000; max-width: 100%; }
.swatch[aria-pressed="true"] { border-color: var(--accent); }
.swatch canvas { width: 100%; height: 100%; display: block; }
</style>

const { useState, useEffect, useRef, useMemo, useCallback, createContext, useContext } = React;

/* ───────────────────────── Data ───────────────────────── */
const CATS = [
  { k: 'odnosi', n: 'Men & women', d: 'relationship dynamics, respect, communication between partners' },
  { k: 'zene', n: "Women's psychology", d: 'how many women experience attention, security and communication, without generalizing' },
  { k: 'muskarci', n: "Men's psychology", d: 'the inner world of men, silence, vulnerability, accountability' },
  { k: 'ljubav', n: 'Love & emotions', d: 'closeness, emotional maturity, what love is and is not' },

  { k: 'samopostovanje', n: 'Self-respect', d: 'personal standards, boundaries, how you treat yourself' },
  { k: 'granice', n: 'Manipulation & boundaries', d: 'recognizing control and guilt tripping, setting and holding boundaries' },
  { k: 'disciplina', n: 'Discipline & masculinity', d: 'habits, keeping your word, ownership, self improvement' },
  { k: 'istine', n: 'Brutal truths', d: 'uncomfortable but useful truths about life, time and people' },
  { k: 'dejting', n: 'Attraction & dating', d: 'meeting people, first dates, confidence, rejection' },

const CAT_TAGS = {
  odnosi: ['#relationships', '#relationshipadvice', '#communication', '#respect', '#psychology'],
  zene: ['#womenpsychology', '#relationships', '#communication', '#psychologyfacts', '#understandingwomen'],
  muskarci: ['#menspsychology', '#menshealth', '#mentalhealthmatters', '#emotions', '#masculinity'],
  ljubav: ['#love', '#emotions', '#lovequotes', '#emotionalintelligence', '#intimacy'],
  raskidi: ['#breakup', '#movingon', '#heartbreak', '#healing', '#letgo'],
  samopostovanje: ['#selfrespect', '#selfworth', '#confidence', '#boundaries', '#personalgrowth'],
  granice: ['#boundaries', '#manipulation', '#toxicrelationships', '#emotionalmaturity', '#redflags'],

// [category, background, angle, text, caption, question]
const DEMO = [
['odnosi','silueta','Integrity',"Respect isn't requested. It *shows* in how you act when no one is watching.","Respect in a relationship isn't built with grand gestures. It's built in the small, consistent things you do when you think they don't count.",'What is the clearest sign of respect in a relationship for you?'],
['odnosi','prozor','Communication',"Most fights don't start because of what was said. They start because of the *tone* it was said in.",'The same sentence can calm an argument or set it on fire. Before you reply, ask how you sound, not just what you say.','What is harder to take: the criticism or the tone it comes in?'],
['odnosi','kisa','Clarity','If you always have to guess where you stand with someone, that is your *answer*.',"Mixed signals aren't a mystery to solve. People who want you in their life don't leave you guessing.",'Have you ever waited too long for a clear answer?'],
['odnosi','hodnik','Consistency',"Big words don't keep a relationship alive. *Boring consistency* does.",'Romance is nice, but trust grows when you show up the way you said you would, day after day. No audience, no applause.','What means more to you: a big gesture or small daily attention?'],
['odnosi','beton','Maturity',"Two people don't have to think the same. They have to know how to *disagree* without humiliating each other.","Disagreement doesn't mean the relationship is broken. The problem starts when one of you has to feel small for the argument to end.",'How do you handle disagreements in a relationship?'],
['odnosi','more','Honesty',"Your partner isn't your therapist. But they also shouldn't be someone you have to *pretend* around.","A healthy relationship has room for your bad days. Not so someone carries them for you, but so you don't have to hide them.","Is it easy for you to show when you're not okay?"],
['zene','kisa','Silence','When a woman stops explaining what hurts, it rarely means it stopped hurting. Often it means she *gave up*.',"Silence after long conversations isn't always peace. Sometimes it's exhaustion from saying the same thing and never being heard.",'Have you ever realized too late what a silence meant?'],
['zene','prozor','Security',"Security isn't only about money. It's the feeling of *not having to* constantly check.","When words and actions match, there's no room for doubt. That's a kind of security no gift can replace.",'What does security in a relationship mean to you?'],
['zene','silueta','Consistency',"Many women aren't looking for a perfect man. They want someone whose words and actions *say the same thing*.",'Perfection is impossible and boring. What people value is being able to trust what they hear.','What matters more: what someone says or what they do?'],
['zene','hodnik','Attention','When she says “it’s fine” and her tone says otherwise, ask again. *Calmly*. Without getting defensive.','Sometimes “it’s fine” means check if you care. One calm question can prevent a big fight.','Is it hard for you to ask again when something feels off?'],
['zene','grad','Sincerity',"Attention that only shows up when you want something isn't attention. It's a *transaction*.","People quickly feel the difference between interest and calculation. Real attention doesn't ask for anything back.",'How do you recognize genuine attention?'],
['zene','more','Presence','No one remembers who talked the best. They remember who was there *when it was hard*.','Nice words are forgotten by next week. Being there in a hard moment is remembered for years.','Who was there for you when it was hardest?'],
['muskarci','silueta','Vulnerability',"Many men aren't silent because they have nothing to say. They're silent because no one ever taught them *how*.","Talking about emotions is a skill, not a talent you're born with. If you didn't learn it as a boy, you can still learn it now.",'Were you taught to talk about your feelings growing up?'],
['muskarci','beton','Accountability',"A man who can't say “I was wrong” isn't strong. He's just *rigid*.",'Strength is admitting a mistake and fixing it. Rigidity protects the ego while relationships crack.','When did you last say “I was wrong”?'],
['muskarci','prozor','Actions and words',"Many men show care through actions. But that's no excuse for the words to *never come*.",'Fixing the car and paying the bills is care. Sometimes it also needs to be said out loud.',"What's easier for you: showing it or saying it?"],
['muskarci','hodnik','Inner battle',"The hardest fight for many men isn't with other people. It's with the voice that says they're *not enough*.","That voice sounds convincing because you've listened to it for years. That doesn't make it true.",'What would you tell your younger self about that voice?'],
['muskarci','dim','Strength',"A man isn't measured by how much he endures. He's measured by what he *builds* afterward.",'Getting through something hard is only half the story. The other half is what you do with it.','What have you built from something that broke you?'],
['muskarci','kisa','Silence',"Silence isn't always strength. Sometimes it's just pain with *nowhere to go*.","If silence is the only way you carry a hard season, find one person you can talk to. That isn't weakness.","Who can you talk to when you're not okay?"],
['ljubav','more','Wholeness',"Love isn't someone filling your emptiness. It's two whole people *choosing* each other.","When you ask someone to fix you, you hand them a weight that isn't theirs. The healthiest relationships happen between people who are already at peace with themselves.",'Do you believe you have to be okay alone first?'],
['ljubav','silueta','Feeling',"We don't just fall for people. We fall for *how we feel* around them.","That's why we sometimes miss people who weren't good for us. We miss the feeling, not them.",'How do you feel around the people you love?'],
['ljubav','prozor','Closeness',"Real closeness is when you can sit in silence with someone and it *doesn't feel awkward*.",'Not every moment needs words. A quiet moment with the right person says more than long conversations.','Who are you comfortable being quiet with?'],
['ljubav','hodnik','Self worth',"Love that asks you to shrink to fit inside it *isn't your size*.","If someone only loves you when you're quieter and smaller, they don't love you. They love the version that suits them.",'Have you ever changed just to be accepted?'],
['ljubav','dim','Control',"Emotions aren't weakness. Weakness is letting them *decide for you*.",'Feeling anger, sadness or jealousy is human. The only question is who makes the decision: you or the moment.','Which emotion takes control of you most often?'],
['ljubav','kisa','Truth','Sometimes the greatest act of love is telling a truth *no one wants to hear*.',"It's easy to be nice. It's harder to be honest when it costs something. But the people we love deserve the truth.",'Would you rather hear a hard truth or a kind lie?'],
['raskidi','kisa','Nostalgia',"Maybe you don't miss her. You miss the version of you *that still had hope*.",'After a breakup we don\'t only grieve the person. We grieve the plans, the feeling and who we were back then.','What did you actually miss most after a breakup?'],
['raskidi','more','Closure',"You don't get closure from the other person. You *give it to yourself*.",'Waiting for an explanation can take years. Sometimes the only ending is the one you decide to write.','Did you get closure, or did you create it?'],
['raskidi','hodnik','Habit',"If you keep going back to the same person for the same reasons, you're not going back to love. You're going back to *habit*.","Familiar isn't the same as good. Sometimes we return only because the pain we know feels easier than the unknown.",'Have you ever gone back to someone out of habit?'],
['raskidi','grad','Future',"A breakup doesn't only hurt because of the person. It hurts because of the *future* you already pictured.","You lose plans, places and days that never happened. It's okay to grieve what never even existed.",'What was hardest to let go of after a breakup?'],
['raskidi','beton','Healing','Stop checking her profile. Every time you look, you *reopen* the wound.','Every look is a small step backward. Give yourself the distance you need for the wound to close.','Have you ever unfollowed someone just so you could move on?'],
['raskidi','dim','Lesson','Some people are a lesson, not a destination. *Thank them* and move on.',"A relationship isn't a failure just because it ended. Some exist to teach you what you won't accept next time.",'What lesson did your last relationship teach you?'],
['samopostovanje','beton','Standards',"Every time you stay where you're not respected, you teach yourself it's *normal*.","What we tolerate becomes our standard. That's why leaving is sometimes the most important lesson you give yourself.",'Where did you stay too long?'],
['samopostovanje','prozor','Firmness',"Self respect is when your “no” doesn't need a *long explanation*.","You don't owe everyone a justification for your boundaries. A short, calm no is a complete sentence.",'Is it hard for you to say no without apologizing?'],
['samopostovanje','silueta','Consistency',"You can't ask others for the respect you don't *give yourself*.",'People notice how you treat yourself. Your standards are the first signal you send to others.','How do you show respect for yourself?'],
['samopostovanje','grad','Space',"Stop apologizing for taking up space. *It's yours.*",'Your opinion, your time and your seat at the table are not favors someone is doing you.',"What do you apologize for when you don't need to?"],
['samopostovanje','hodnik','Peace',"When you stop chasing approval, you'll see who was *really* there.",'The people who stay when you stop proving yourself are the ones worth keeping.','Who stayed when you stopped trying to hold on?'],
['samopostovanje','dim','Boundaries','People treat you the way you *allow* them to.','The first time is their choice. Every time after that is also your decision to accept it.','What do you no longer allow anyone to do?'],
['granice','kisa','Guilt',"If you feel guilty after every conversation and don't know why, that's not a coincidence. It's a *pattern*.","Healthy communication doesn't leave you confused and guilty every time. When it keeps happening, look closely at what's really going on.",'Have you ever felt guilty without a clear reason?'],
['granice','beton','Firmness',"A boundary you don't defend isn't a boundary. It's a *suggestion*.",'Stating a boundary is the first step. Holding it when someone tests it is what makes it real.','Which boundary is hardest for you to defend?'],
['granice','prozor','Recognition','Control rarely sounds like a threat. Usually it sounds like *“I just worry about you.”*',"Care respects your choice. Control hides behind care. The difference is whether you're allowed to say no.",'How do you tell care from control?'],
['granice','hodnik','Clarity','When someone gets angry at your boundary, they just showed you *why you need it*.',"People who respect you may disagree, but they'll accept it. Anger at your no says more about them than about you.",'How do people around you react when you set a boundary?'],
['granice','dim','Accountability',"“You're too sensitive” is the shortest way to avoid responsibility for what someone *said*.","Your reaction can be discussed. That doesn't erase what was said before it.",'Has someone dismissed your feelings instead of apologizing?'],
['granice','more','Peace',"You don't have to win an argument with someone who refuses to understand you. You can *walk away*.",'Not every argument is an invitation to fight. Some are just a way to drain your energy.','When did you last choose peace over winning?'],
['disciplina','hodnik','Persistence','Motivation gets you started. *Discipline* gets you to the finish.',"Motivation depends on your mood. Discipline works on the days you don't feel like doing anything.","What do you do even when you don't feel like it?"],
['disciplina','beton','Ownership',"No one is coming to save you. And that's actually *good news*.","If no one is coming, the wheel is in your hands. That's a weight, but it's also freedom.",'What would you change if you knew no one would do it for you?'],
['disciplina','silueta','Your word',"Masculinity isn't in your voice, your muscles or your wallet. It's in *keeping your word*.",'Promising is easy. Delivering when it gets uncomfortable is where character shows.','What is a true sign of masculinity to you?'],
['disciplina','prozor','Small steps',"You don't need a fresh start. You need the *next small step*, today.",'Waiting for the perfect Monday is just another way to procrastinate. A small step today beats a big plan for tomorrow.',"What's your next small step?"],
['disciplina','grad','Habits',"The people you admire didn't have more time. They had *fewer excuses*.",'We all get the same day. The difference is what we choose to do with it.','Which excuse steals the most of your time?'],
['disciplina','dim','Control',"If you don't run your morning, your morning *runs you*.",'The first hour often sets the tone for the rest of the day. Your phone can wait.','What do you do in the first hour after waking up?'],
['istine','grad','Freedom',"No one thinks about you as much as you're *afraid* they do.","Most people are busy with their own worries. That isn't insulting, it's freeing.","What would you do if you didn't care what people think?"],
['istine','beton','Change',"People don't change when you tell them to. They change when they *decide to*.","You can explain, plead and wait. But change that isn't their decision doesn't last.",'Have you ever waited for someone to change?'],
['istine','more','Time',"Time doesn't heal anything on its own. What heals is what you *do* with that time.",'Years can pass and the wound can stay the same. Healing comes from what you do, not from the calendar.','What actually helped you get over something?'],
['istine','kisa','Acceptance',"There will be people you'll never be enough for. *That's not your job.*",'You can try until you\'re exhausted and still not get recognition. Some standards were never meant for you.','Who did you try to prove yourself to for too long?'],
['istine','hodnik','Fear',"Often it isn't fear of failure that stops you. It's fear of what *others will say*.","Failure can be fixed. A life spent waiting for approval can't.",'What would you try if no one was watching?'],
['istine','dim','Habits','Your habits today are your life in *five years*.','Big changes rarely happen all at once. They come from small things you repeat every day.','Which habit do you want to have five years from now?'],
['dejting','grad','Attraction',"Attraction can't be faked. It shows when you're *genuinely busy* with your own life.","When you have goals, friends and interests, you don't have to pretend to be interesting. You just are.",'What makes you feel most like yourself?'],
['dejting','prozor','Presence',"On a first date you don't have to impress. You have to be *present*.","Phone in your pocket, attention on the person across from you. That's remembered longer than any story.",'What matters most to you on a first date?'],
['dejting','silueta','Effort',"If you're wondering whether someone likes you, watch the effort, not the words. *Effort doesn't lie.*",'Sweet texts are easy. Time, attention and showing up when you said you would are what tell the truth.','Do words or effort tell you more?'],
['dejting','hodnik','Confidence',"Confidence isn't being sure they'll say yes. It's being *okay* with no.","Rejection isn't a verdict on your worth. It's just information that it wasn't the right match.",'How do you handle rejection?'],
['dejting','beton','Listening','The most attractive trait nobody talks about: *listening* without waiting for your turn to speak.','Most people listen only to reply. When you really listen, the other person feels it right away.','Is it easier for you to talk or to listen?'],
['dejting','kisa','Dignity',"No reply is also a reply. Don't ask for it a *second time*.","You don't need to text a third time to get clarity. Sometimes silence is all the clarity you need.",'How long do you wait for a reply before letting go?'],
];

Return only a JSON array of objects with the keys: text, caption, hashtags, background, angle, question${cat === 'mix' ? ', category' : ''}.`;

        const arr = Array.isArray(out) ? out : (out && Array.isArray(out.posts) ? out.posts : []);
        const seen = existing.slice();
        arr.forEach((o, i) => {
          if (!o || typeof o.text !== 'string' || !o.text.trim()) return;
          if (isDuplicate(o.text, seen)) { skipped++; return; }
          seen.push(o.text);
          const c = cat === 'mix' ? (CAT[o.category] ? o.category : CATS[i % CATS.length].k) : cat;
          const tags = (Array.isArray(o.hashtags) ? o.hashtags : String(o.hashtags || '').split(/\s+/)).map(t => String(t).trim()).filter(Boolean).map(t => t.startsWith('#') ? t : '#' + t);

        });
        if (!made.length) throw new Error('Claude did not return usable posts. Try again.');
      }
      if (made.length) addPosts(made);
      setResult({ made, skipped, note });
      if (made.length) notify(`Added to library: ${made.length}`);
    } catch (e) {
      const code = e && e.code;
      setErr(code === 'not_granted' ? 'This page was not allowed to use Claude. Use the demo library or allow access.' : code === 'rate_limited' ? 'Too many requests in a short time. Wait a minute and try again.' : (e && e.message) || 'Generation failed.');

  }

function Library({ posts, update, remove, openEditor, notify }) {
  const { settings } = useContext(Ctx);
  const [cat, setCat] = useState('all'); const [st, setSt] = useState('all'); const [q, setQ] = useState(''); const [sel, setSel] = useState(() => new Set());
  const [busy, setBusy] = useState(false); const [prog, setProg] = useState(''); const [fmt, setFmt] = useState({ png: true, jpg: false, mp4: false }); const [confirmDel, setConfirmDel] = useState(null);
  const list = posts.filter(p => (cat === 'all' || p.cat === cat) && (st === 'all' || (st === 'fav' ? p.fav : st === 'published' ? p.status === 'published' : st === 'scheduled' ? (p.date && p.status !== 'published') : st === 'ai' ? p.source === 'ai' : st === 'demo' ? p.source === 'demo' : (!p.date && p.status !== 'published'))) && (!q || plain(p.text).toLowerCase().includes(q.toLowerCase()))).sort((a, b) => b.createdAt - a.createdAt);
  const toggle = id => setSel(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const allSel = list.length && list.every(p => sel.has(p.id));
  const chosen = posts.filter(p => sel.has(p.id));

  async function exportZip() {
    if (!chosen.length) return; setBusy(true);
    try {
      const zip = new JSZip(); const all = [];
      for (let i = 0; i < chosen.length; i++) {
        const p = chosen[i], name = slug(p, i);
        if (fmt.png) { setProg(`Image ${i + 1}/${chosen.length}`); zip.file(name + '.png', await imageBlob(p, settings, 'png')); }
        if (fmt.jpg) { setProg(`Image ${i + 1}/${chosen.length}`); zip.file(name + '.jpg', await imageBlob(p, settings, 'jpg')); }
        if (fmt.mp4) { const r = await videoBlob(p, settings, settings.duration || 8, v => setProg(`Video ${i + 1}/${chosen.length} · ${Math.round(v * 100)}%`)); zip.file(name + '.' + r.ext, r.blob); }
        const c = fullCaption(p, settings); zip.file(name + '.txt', c); all.push(`${name}\n${plain(p.text)}\n\n${c}`);
      }
      zip.file('all-captions.txt', all.join('\n\n────────────\n\n'));
      setProg('Packing ZIP…'); const blob = await zip.generateAsync({ type: 'blob' });
      const r = await saveFile(`reels-${ymd(new Date())}.zip`, blob); if (r === 'saved') notify(`ZIP saved (${chosen.length} posts)`);
    } catch (e) { notify(e.message || 'Export failed.'); } finally { setBusy(false); setProg(''); }
  }

  return html`<div className="fade-in">
    <${PageHead} eyebrow="Content Library" title=${`${posts.length} ${posts.length === 1 ? 'post' : 'posts'}`} />
    <div className="flex flex-col gap-3 mb-5">
      <div className="scroll-x -mx-1 px-1"><div className="flex gap-2">${[{ k: 'all', n: 'All categories' }, ...CATS].map(c => html`<button key=${c.k} className="chip" aria-pressed=${String(cat === c.k)} onClick=${() => setCat(c.k)}>${c.n}</button>`)}</div></div>
      <div className="flex flex-wrap gap-3 items-center">
        <select className="field w-auto" id="lib-status" aria-label="Filter" value=${st} onChange=${e => setSt(e.target.value)}>
          <option value="all">All statuses</option><option value="draft">Drafts</option><option value="scheduled">Scheduled</option><option value="published">Published</option><option value="fav">Favorites</option><option value="ai">AI only</option><option value="demo">Demo only</option>
        </select>
        <input className="field w-auto flex-1 min-w-[160px]" id="lib-q" placeholder="Search text" value=${q} onInput=${e => setQ(e.target.value)} />
        <button className="btn btn-sm" onClick=${() => setSel(allSel ? new Set() : new Set(list.map(p => p.id)))}>${allSel ? 'Clear selection' : 'Select shown'}</button>
      </div>
    </div>
    ${sel.size > 0 && html`<div className="card p-4 mb-5 flex flex-wrap items-center gap-4 fade-in" style=${{ borderColor: '#4a4234' }}>
      <span className="text-[13px] font-semibold tnum">Selected: ${sel.size}</span>
      ${['png', 'jpg', 'mp4'].map(f => html`<label key=${f} className="flex items-center gap-2 text-[13px] mono uppercase"><input type="checkbox" checked=${fmt[f]} onChange=${e => setFmt({ ...fmt, [f]: e.target.checked })} /> ${f}</label>`)}
      <button className="btn btn-primary btn-sm" disabled=${busy || !(fmt.png || fmt.jpg || fmt.mp4)} onClick=${exportZip}><${Icon} n="down" s=${14} /> ${busy ? prog || 'Working…' : 'Download ZIP'}</button>
      <button className="btn btn-sm" onClick=${() => { chosen.forEach(p => update(p.id, x => ({ ...x, status: 'published' }))); notify('Marked as published'); }}>Mark published</button>
      ${confirmDel === 'bulk' ? html`<button className="btn btn-sm btn-danger" onClick=${() => { remove([...sel]); setSel(new Set()); setConfirmDel(null); notify('Deleted'); }}>Confirm delete ${sel.size}</button>` : html`<button className="btn btn-sm btn-ghost btn-danger" onClick=${() => setConfirmDel('bulk')}>Delete</button>`}
      ${fmt.mp4 && html`<span className="text-[12px] text-mute">Each video takes about ${settings.duration || 8} s to render.</span>`}
    </div>`}
    ${!list.length && html`<div className="card p-8 text-center text-mute">No posts match this filter.</div>`}
    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-6 gap-4">
      ${list.map(p => html`<article key=${p.id} className="min0 flex flex-col gap-2">
        <div className="relative">
          <button className="block w-full" onClick=${() => openEditor(p.id)} aria-label=${'Edit: ' + plain(p.text)}><${PostCanvas} post=${p} w=${300} /></button>
          <div className="absolute top-2 left-2 flex flex-wrap gap-1 pointer-events-none"><${SourceBadge} p=${p} /><${StatusBadge} p=${p} /></div>
          <label className="absolute top-2 right-2 w-7 h-7 rounded-md flex items-center justify-center" style=${{ background: 'rgba(0,0,0,.6)' }}><input type="checkbox" aria-label="Select" checked=${sel.has(p.id)} onChange=${() => toggle(p.id)} /></label>
        </div>
        <div className="text-[12px] text-mute truncate">${(CAT[p.cat] || {}).n}</div>
        <div className="flex gap-1">
          <button className="btn btn-sm btn-ghost px-2" title="Favorite" aria-label="Favorite" aria-pressed=${String(p.fav)} style=${p.fav ? { color: 'var(--accent)' } : null} onClick=${() => update(p.id, x => ({ ...x, fav: !x.fav }))}><${Icon} n="star" s=${15} /></button>
          <button className="btn btn-sm btn-ghost px-2" title=${p.status === 'published' ? 'Move back to drafts' : 'Mark published'} aria-label="Published" style=${p.status === 'published' ? { color: 'var(--ok)' } : null} onClick=${() => update(p.id, x => ({ ...x, status: x.status === 'published' ? (x.date ? 'scheduled' : 'draft') : 'published' }))}><${Icon} n="check" s=${15} /></button>
          <button className="btn btn-sm btn-ghost px-2" title="Edit" aria-label="Edit" onClick=${() => openEditor(p.id)}><${Icon} n="edit" s=${15} /></button>
          ${confirmDel === p.id ? html`<button className="btn btn-sm btn-danger ml-auto" onClick=${() => { remove([p.id]); setConfirmDel(null); }}>Delete?</button>` : html`<button className="btn btn-sm btn-ghost px-2 ml-auto" title="Delete" aria-label="Delete" onClick=${() => setConfirmDel(p.id)}><${Icon} n="trash" s=${15} /></button>`}
        </div>
      </article>`)}
    </div></div>`;
}

function Calendar({ posts, update, openEditor, go, notify }) {
  const [wk, setWk] = useState(() => startOfWeek(new Date())); const [perDay, setPerDay] = useState(1);
  const days = [...Array(7)].map((_, i) => ymd(addDays(wk, i)));
  const TIMES = { 1: ['19:00'], 2: ['12:00', '19:00'], 3: ['08:00', '12:00', '19:00'] };
  function plan() {
    const need = []; days.forEach(d => { const have = posts.filter(p => p.date === d).length; for (let k = have; k < perDay; k++) need.push({ d, k }); });
    const pool = posts.filter(p => !p.date && p.status !== 'published').sort((a, b) => a.createdAt - b.createdAt);
    const byCat = {}; pool.forEach(p => (byCat[p.cat] = byCat[p.cat] || []).push(p)); const order = []; let added = true;
    while (added) { added = false; for (const c of Object.keys(byCat)) { const p = byCat[c].shift(); if (p) { order.push(p); added = true; } } }
    let n = 0; need.forEach((slot, i) => { const p = order[i]; if (!p) return; update(p.id, x => ({ ...x, date: slot.d, time: TIMES[perDay][slot.k] || '19:00', status: 'scheduled' })); n++; });
    const missing = need.length - n;
    notify(missing > 0 ? `Scheduled ${n}. You need ${missing} more drafts, generate new posts.` : `Scheduled ${n} posts`);
  }
  const label = `${fmtDay(wk)} – ${fmtDay(addDays(wk, 6))}, ${addDays(wk, 6).getFullYear()}`;
  const drafts = posts.filter(p => !p.date && p.status !== 'published').length;
  return html`<div className="fade-in">
    <${PageHead} eyebrow="Content Calendar" title=${label}>
      <button className="btn" onClick=${() => setWk(addDays(wk, -7))} aria-label="Previous week">←</button>
      <button className="btn" onClick=${() => setWk(startOfWeek(new Date()))}>This week</button>
      <button className="btn" onClick=${() => setWk(addDays(wk, 7))} aria-label="Next week">→</button>
    <//>
    <div className="card p-4 mb-5 flex flex-wrap items-center gap-4">
      <div><div className="lbl">Posts per day</div><${Seg} label="Posts per day" value=${perDay} onChange=${setPerDay} options=${[1, 2, 3].map(v => ({ v, l: String(v) }))} /></div>
      <button className="btn btn-primary" onClick=${plan}><${Icon} n="cal" /> Build weekly plan</button>
      <p className="text-[12.5px] text-mute flex-1 min-w-[200px]">The plan fills empty days with drafts and mixes categories. Times are in your audience's time zone. Drafts available: <span className="tnum">${drafts}</span>.</p>
    </div>
    <div className="scroll-x"><div className="grid grid-cols-7 gap-3 min-w-[840px]">
      ${days.map((d, i) => { const items = posts.filter(p => p.date === d).sort((a, b) => (a.time || '').localeCompare(b.time || '')); const today = d === ymd(new Date());
        return html`<div key=${d} className="flex flex-col gap-2 min0">
          <div className="flex items-baseline justify-between px-1"><span className=${'mono text-[11px] ' + (today ? 'text-brass' : 'text-mute')}>${DAYS[i]}</span><span className="text-[13px] tnum">${parseYmd(d).getDate()}</span></div>
          <div className="rounded-lg p-2 flex flex-col gap-3 min-h-[200px]" style=${{ background: 'var(--panel)', border: '1px solid ' + (today ? '#4a4234' : 'var(--line)') }}>
            ${items.map(p => html`<div key=${p.id} className="flex flex-col gap-1">
              <button onClick=${() => openEditor(p.id)} aria-label=${'Edit: ' + plain(p.text)}><${PostCanvas} post=${p} w=${220} /></button>
              <div className="flex items-center justify-between"><span className="mono text-[10.5px] text-mute">${p.time || ''}</span>${p.status === 'published' ? html`<span className="badge badge-pub">Published</span>` : html`<button className="btn btn-sm btn-ghost px-1.5 h-6 text-[11px]" onClick=${() => update(p.id, x => ({ ...x, status: 'published' }))}>Mark posted</button>`}</div>
              <button className="text-[11px] text-mute hover:text-fg text-left" onClick=${() => update(p.id, x => ({ ...x, date: null, time: null, status: x.status === 'published' ? 'published' : 'draft' }))}>Remove from day</button>
            </div>`)}
            ${!items.length && html`<span className="text-[11.5px] text-mute m-auto">Empty</span>`}
          </div></div>`; })}
    </div></div>
    ${drafts === 0 && html`<p className="text-mute text-[13px] mt-4">No free drafts left. <button className="underline" onClick=${() => go('generator')}>Generate new posts</button>.</p>`}
  </div>`;
}

function Settings({ setSettings, posts, replaceAll, notify, storeMode }) {
  const { settings, caps } = useContext(Ctx);
  const [s, setS] = useState(settings); const [confirm, setConfirm] = useState(false); const impRef = useRef(null);
  useEffect(() => setS(settings), [settings]);
  const ch = patch => { const n = { ...s, ...patch }; setS(n); setSettings(n); };
  async function exportJson() { try { const r = await saveFile(`reels-library-${ymd(new Date())}.json`, JSON.stringify({ settings, posts }, null, 2)); if (r === 'saved') notify('Backup saved'); } catch (e) { notify(e.message); } }
  async function importJson(e) {
    const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
    try { const data = JSON.parse(await f.text()); if (!Array.isArray(data.posts)) throw new Error(); const ids = new Set(posts.map(p => p.id)); const add = data.posts.filter(p => p && p.id && p.text && p.design && !ids.has(p.id)); replaceAll([...posts, ...add]); notify(`Imported ${add.length} posts`); }
    catch { notify('File not recognized. Import a JSON backup exported from this app.'); }
  }
  return html`<div className="fade-in max-w-[860px]">
    <${PageHead} eyebrow="Settings" title="Profile and export" />
    <div className="flex flex-col gap-5">
      <section className="card p-5 grid sm:grid-cols-2 gap-4">
        <h2 className="sm:col-span-2 text-[15px] font-semibold">Branding on images</h2>
        <div><label className="lbl" htmlFor="st-handle">Instagram handle</label><input id="st-handle" className="field" value=${s.handle} onInput=${e => ch({ handle: e.target.value })} /></div>
        <div><label className="lbl" htmlFor="st-accent">Highlight color</label>
          <div className="flex gap-2 items-center"><input id="st-accent" type="color" value=${s.accent} onInput=${e => ch({ accent: e.target.value })} className="h-[38px] w-[52px] rounded-md bg-transparent border border-line" />
            ${['#d6bf94', '#e9e4da', '#c4573f', '#8fb0c9', '#b9c48f'].map(c => html`<button key=${c} className="w-7 h-7 rounded-full" style=${{ background: c, outline: s.accent === c ? '2px solid var(--fg)' : 'none', outlineOffset: '2px' }} aria-label=${'Color ' + c} onClick=${() => ch({ accent: c })}></button>`)}</div></div>
        <label className="flex items-center gap-2 text-[13px]"><input type="checkbox" checked=${s.showHandle} onChange=${e => ch({ showHandle: e.target.checked })} /> Show handle on images</label>
      </section>
      <section className="card p-5 grid sm:grid-cols-2 gap-4">
        <h2 className="sm:col-span-2 text-[15px] font-semibold">Caption</h2>
        <div><label className="lbl" htmlFor="st-cta">Follow line (your handle is added after it)</label><input id="st-cta" className="field" value=${s.cta} onInput=${e => ch({ cta: e.target.value })} /></div>
        <div><label className="lbl" htmlFor="st-emo">Closing emojis</label><input id="st-emo" className="field" value=${s.emojis} onInput=${e => ch({ emojis: e.target.value })} /></div>
        <label className="flex items-center gap-2 text-[13px]"><input type="checkbox" checked=${s.noHyphens} onChange=${e => ch({ noHyphens: e.target.checked })} /> Remove hyphens and dashes from captions</label>
      </section>
      <section className="card p-5 grid sm:grid-cols-2 gap-4">
        <h2 className="sm:col-span-2 text-[15px] font-semibold">Defaults</h2>
        <div><label className="lbl" htmlFor="st-tpl">Generator template</label><select id="st-tpl" className="field" value=${s.defaultTpl} onChange=${e => ch({ defaultTpl: e.target.value })}><option value="auto">Rotate all five</option>${Object.entries(TPL).map(([k, t]) => html`<option key=${k} value=${k}>${t.no} ${t.n}</option>`)}</select></div>
        <${Slider} id="st-dur" label="Video length" value=${s.duration} min=${6} max=${10} step=${1} onChange=${v => ch({ duration: v })} fmt=${v => v + ' s'} />
      </section>
      <section className="card p-5 flex flex-col gap-3">
        <h2 className="text-[15px] font-semibold">Status</h2>
        <dl className="grid grid-cols-[140px_minmax(0,1fr)] gap-y-2 text-[13px]">
          <dt className="text-mute">AI text</dt><dd>${caps.sample ? 'Claude is available, no API key needed' : 'Not available in this view, demo mode is on'}</dd>
          <dt className="text-mute">Storage</dt><dd>${storeMode === 'cloud' ? 'Saved privately to your account' : 'Saved in this browser only'}</dd>
          <dt className="text-mute">Downloads</dt><dd>${caps.dl ? 'Available' : (window.claude ? 'Not available in this view' : 'Direct from the browser')}</dd>
          <dt className="text-mute">MP4</dt><dd>${'VideoEncoder' in window ? 'Real H.264 MP4 rendered in the browser' : 'Real time recording (MP4 or WebM, depending on the browser)'}</dd>
        </dl>
      </section>
      <section className="card p-5 flex flex-wrap gap-3 items-center">
        <h2 className="w-full text-[15px] font-semibold">Data</h2>
        <button className="btn" onClick=${exportJson}><${Icon} n="down" s=${14} /> Export library (JSON)</button>
        <button className="btn" onClick=${() => impRef.current && impRef.current.click()}><${Icon} n="up" s=${14} /> Import JSON</button>
        <input ref=${impRef} type="file" accept="application/json,.json" hidden onChange=${importJson} />
        ${confirm ? html`<button className="btn btn-danger" onClick=${() => { replaceAll([]); setConfirm(false); notify('Library cleared'); }}>Confirm deleting ${posts.length} posts</button>` : html`<button className="btn btn-ghost btn-danger" onClick=${() => setConfirm(true)}><${Icon} n="trash" s=${14} /> Delete all posts</button>`}
      </section>
    </div></div>`;
}

/* ───────────────────────── App ───────────────────────── */
function App() {
  const [posts, setPosts] = useState(() => lsGet(K.posts, null) || seedPosts());
  const [settings, setSettingsState] = useState(() => migrateSettings({ ...DEFAULT_SETTINGS, ...lsGet(K.settings, {}) }));
  const [page, setPage] = useState(() => { const h = location.hash.slice(1); return NAV.some(n => n.k === h) ? h : 'overview'; });
  const [editId, setEditId] = useState(null); const [toast, setToast] = useState(''); const [ver, setVer] = useState(0);
  const [caps, setCaps] = useState({ sample: null, dl: null }); const [storeMode, setStoreMode] = useState('local');
  const postsRef = useRef(posts); postsRef.current = posts;
  const bump = useCallback(() => setVer(v => v + 1), []);
  const notify = useCallback(m => { setToast(m); clearTimeout(notify.t); notify.t = setTimeout(() => setToast(''), 3200); }, []);

  useEffect(() => { Store.saveLocal(posts); }, [posts]);
  useEffect(() => {
    loadFonts().then(bump);
    (lsGet('kadar.imgs', []) || []).forEach(id => { const url = lsGet('kadar.img.' + id, null); if (!url) return; const img = new Image(); img.onload = () => { const c = mk(); c.getContext('2d').drawImage(img, 0, 0, W0, H0); UPLOADS.set(id, c); BGCACHE.forEach((_, k) => k.startsWith('up:' + id) && BGCACHE.delete(k)); bump(); }; img.src = url; });
    const onHash = () => { const h = location.hash.slice(1); if (NAV.some(n => n.k === h)) setPage(h); };
    window.addEventListener('hashchange', onHash);
    (async () => {
      const [sample, dl, db, user] = await Promise.all([useCap('sample'), useCap('downloads'), useCap('db'), useCap('user')]);
      CAPS.dl = dl; CAPS.sample = sample; setCaps({ sample, dl });
      if (db && user) {
        try {
          const id = await user.id(); Store.db = db; Store.base = 'data/users/' + id; setStoreMode('cloud');
          try { const ss = await db.doc(Store.base + '/settings_en').get(); if (ss.exists) { const v = migrateSettings({ ...DEFAULT_SETTINGS, ...ss.data() }); setSettingsState(v); lsSet(K.settings, v); } } catch {}
          let first = true;
          db.collection(Store.base + '/reels/posts_en').onSnapshot(snap => {
            const remote = snap.docs.map((d, i) => { const raw = d.data(); if (!raw || !raw.text) return null; if (raw.design && raw.id) return raw; const n = normalizePost(raw, d.id, i); Store.put(n); return n; }).filter(Boolean);
            if (first) { first = false; if (!remote.length) { postsRef.current.forEach(p => Store.put(p)); return; } }
            setPosts(local => { const byId = new Map(remote.map(p => [p.id, p])); local.forEach(p => { if (Store.pending(p.id)) byId.set(p.id, p); }); return [...byId.values()]; });
          }, () => { Store.db = null; setStoreMode('local'); });
        } catch { Store.db = null; }
      }
    })();
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const go = k => { setPage(k); try { history.replaceState(null, '', '#' + k); } catch { location.hash = k; } window.scrollTo(0, 0); };
  const openEditor = id => { setEditId(id); go('editor'); };
  const addPosts = list => { setPosts(p => [...p, ...list]); list.forEach(x => Store.put(x)); };
  const update = (id, fn) => setPosts(ps => ps.map(p => { if (p.id !== id) return p; const n = typeof fn === 'function' ? fn(p) : { ...p, ...fn }; Store.put(n); return n; }));
  const remove = ids => { setPosts(ps => ps.filter(p => !ids.includes(p.id))); ids.forEach(id => Store.del(id)); };
  const replaceAll = list => { const keep = new Set(list.map(p => p.id)); postsRef.current.forEach(p => { if (!keep.has(p.id)) Store.del(p.id); }); list.forEach(p => Store.put(p)); setPosts(list); };
  const setSettings = s => { setSettingsState(s); Store.putSettings(s); };
  const editPost = posts.find(p => p.id === editId) || null;
  const ctx = useMemo(() => ({ settings, ver, caps, bump }), [settings, ver, caps, bump]);

  let body;
  if (page === 'overview') body = html`<${Overview} posts=${posts} go=${go} openEditor=${openEditor} />`;
  else if (page === 'generator') body = html`<${Generator} posts=${posts} addPosts=${addPosts} openEditor=${openEditor} notify=${notify} />`;
  else if (page === 'editor') body = html`<${Editor} key=${editId || 'none'} post=${editPost} posts=${posts} update=${update} openEditor=${openEditor} addPosts=${addPosts} notify=${notify} go=${go} />`;
  else if (page === 'templates') body = html`<${Templates} posts=${posts} setSettings=${setSettings} update=${update} notify=${notify} />`;
  else if (page === 'library') body = html`<${Library} posts=${posts} update=${update} remove=${remove} openEditor=${openEditor} notify=${notify} />`;
  else if (page === 'calendar') body = html`<${Calendar} posts=${posts} update=${update} openEditor=${openEditor} go=${go} notify=${notify} />`;
  else body = html`<${Settings} setSettings=${setSettings} posts=${posts} replaceAll=${replaceAll} notify=${notify} storeMode=${storeMode} />`;

  return html`<${Ctx.Provider} value=${ctx}>
    <div className="min-h-full lg:grid lg:grid-cols-[232px_minmax(0,1fr)]">
      <aside className="lg:sticky lg:top-0 lg:h-screen lg:border-r border-line flex flex-col" style=${{ background: 'var(--bg)' }}>
        <div className="gutter lg:px-5 pt-5 pb-3 lg:pt-7 flex items-center justify-between lg:block">
          <div><div className="disp text-[30px] leading-none">Kadar</div><div className="eyebrow mt-1.5">Reels studio</div></div>
          <span className="lg:hidden mono text-[10px] text-mute">${storeMode === 'cloud' ? 'saved to account' : 'local'}</span>
        </div>
        <nav className="scroll-x lg:overflow-visible gutter lg:px-3 pb-3 border-b border-line lg:border-0" aria-label="Main menu">
          <div className="flex lg:flex-col gap-1">
            ${NAV.map((n, i) => html`<a key=${n.k} href=${'#' + n.k} className="navbtn" aria-current=${page === n.k ? 'page' : undefined} onClick=${e => { e.preventDefault(); if (n.k === 'editor' && !editPost) setEditId(null); go(n.k); }}>
              <span className="num hidden lg:inline">${String(i + 1).padStart(2, '0')}</span><span>${n.n}</span></a>`)}
          </div>
        </nav>
        <div className="hidden lg:block mt-auto px-5 pb-6 text-[11.5px] text-mute leading-relaxed">
          <div className="flex items-center gap-2 mb-1"><i className="block w-1.5 h-1.5 rounded-full" style=${{ background: caps.sample ? 'var(--ok)' : 'var(--mute)' }}></i>${caps.sample ? 'Claude AI connected' : 'Demo mode'}</div>
          <div>${storeMode === 'cloud' ? 'Saved to your account' : 'Saved in this browser'}</div>
        </div>
      </aside>
      <main className="gutter py-6 lg:py-10 lg:px-10 min0">${body}</main>
    </div>
    ${toast && html`<div className="toast fade-in" role="status">${toast}</div>`}
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
