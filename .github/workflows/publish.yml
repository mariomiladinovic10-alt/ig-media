name: Publish to Instagram

on:
  schedule:
    - cron: "7 * * * *"   # every hour, minute 7 (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ig-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish due posts
        env:
          IG_TOKEN_MIND: ${{ secrets.IG_TOKEN_MIND }}
          IG_TOKEN_QML: ${{ secrets.IG_TOKEN_QML }}
        run: python3 scripts/ig.py publish
      - name: Save queue status
        run: |
          if [ -n "$(git status --porcelain queue)" ]; then
            git config user.name "ig-media bot"
            git config user.email "actions@users.noreply.github.com"
            git add queue
            git commit -m "Update queue status"
            git pull --rebase -q || true
            git push
          fi
